appId: io.github.unrefined803.rpgraph
productName: RPgraph Studio
copyright: Copyright © 2026 unrefined803

asar: true

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - "!electron/**/*.test.ts"
  - comfy-workflows/api-workflows-with-variables/**/*
  - src/assets/app-icons/rpgraph.png
  - src/session/formatVersions.json
  - src/storybook/formatVersions.json
  - src/workflow/formatVersions.json
  - shared/**/*.cjs
  - shared/**/*.mjs
  - package.json
  - LICENSE

extraResources:
  - from: scripts/decrypt-account.mjs
    to: account-tools/scripts/decrypt-account.mjs
  - from: electron/accounts
    to: account-tools/electron/accounts
    filter:
      - accountArchive.cjs
      - accountCrypto.cjs
  - from: node_modules
    to: account-tools/node_modules
    filter:
      - yauzl/**/*
      - yazl/**/*
      - pend/**/*
      - buffer-crc32/**/*
  - from: docs/account-management/user-guide.md
    to: account-tools/README.md
  - from: docs/account-management/archive-v1.md
    to: account-tools/archive-v1.md
  - from: docs/account-management/format-v1.md
    to: account-tools/format-v1.md
  - from: LICENSE
    to: account-tools/LICENSE
  - from: scripts
    to: character-face-tools
    filter:
      - character-faces.mjs
      - detect-character-faces.py
  - from: resources/default-content
    to: default-content
    filter:
      - "**/*"
  - from: resources/npc-characters
    to: npc-characters
    filter:
      - "**/*"
  - from: resources/themes
    to: themes
    filter:
      - "**/*"
  - from: resources/phone-themes
    to: phone-themes
    filter:
      - "**/*"

artifactName: RPGraph-Studio-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  executableName: rpgraph-studio
  icon: src/assets/app-icons/rpgraph-512.png
  syncDesktopName: true
