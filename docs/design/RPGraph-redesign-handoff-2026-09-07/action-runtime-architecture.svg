<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">RPGraph proposed action and routing architecture</title><desc id="desc">Workflow selectors deterministically choose a prompt. The model chooses actions and destinations. A typed runtime validates, generates and commits results. Renderers use real records without copying identifiers through prose.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203249}.title{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#52627a}.box{fill:#fff;stroke:#b9c9dc;stroke-width:2}.wire{fill:none;stroke:#617995;stroke-width:3}.dash{fill:none;stroke:#617995;stroke-width:2;stroke-dasharray:7 5}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#617995"/></marker></defs>
<rect width="1400" height="1000" fill="#f3f6fa"/><text x="42" y="52" class="title">RPGraph · proposed execution architecture</text><text x="42" y="84" class="body">Colors illustrate grouping only. Keep the target system's existing theme; implement the architecture and behavior.</text>
<rect x="28" y="113" width="1344" height="206" rx="15" fill="#eaf0fa"/><text x="48" y="144" class="small">1 · WORKFLOW ROUTING — DETERMINISTIC</text>
<rect x="48" y="167" width="302" height="120" rx="10" class="box"/><text x="67" y="202" class="h">Existing inputs</text><text x="67" y="234" class="body">Text + images</text><text x="67" y="263" class="body">Output value + prompt value</text>
<rect x="414" y="167" width="393" height="120" rx="10" class="box"/><text x="434" y="202" class="h">Resolve stable route</text><text x="434" y="234" class="body">Validate pair → select prompt</text><text x="434" y="263" class="body">Preserve selected graph output</text>
<rect x="870" y="167" width="477" height="120" rx="10" class="box"/><text x="890" y="202" class="h">Assemble current-turn context</text><text x="890" y="234" class="body">Authored prompts + relevant history + images</text><text x="890" y="263" class="body">Current entities + enabled action contracts</text>
<path d="M350 227 H406" class="wire" marker-end="url(#a)"/><path d="M807 227 H862" class="wire" marker-end="url(#a)"/>
<rect x="28" y="340" width="1344" height="181" rx="15" fill="#eeeafa"/><text x="48" y="371" class="small">2 · MODEL DECISION — CREATIVE CHOICE</text>
<rect x="48" y="393" width="568" height="101" rx="10" class="box"/><text x="68" y="428" class="h">LLM selects intent and placement</text><text x="68" y="459" class="body">None / generate / send / post / inspect / continue</text>
<rect x="678" y="393" width="669" height="101" rx="10" class="box"/><text x="698" y="428" class="h">Typed intent + text/action blocks</text><text x="698" y="459" class="body">Actor, recipient, app, content, attachment source and order</text>
<path d="M1108 287 V330 H332 V385" class="wire" marker-end="url(#a)"/><path d="M616 444 H670" class="wire" marker-end="url(#a)"/>
<rect x="28" y="542" width="1344" height="218" rx="15" fill="#e4f2ec"/><text x="48" y="573" class="small">3 · ACTION RUNTIME — VALIDATED EXECUTION</text>
<rect x="48" y="597" width="355" height="133" rx="10" class="box"/><text x="68" y="633" class="h">Validate and bind</text><text x="68" y="664" class="body">Schemas, capabilities and real entities</text><text x="68" y="696" class="body">Generate internal operation IDs</text>
<rect x="455" y="597" width="418" height="133" rx="10" class="box"/><text x="475" y="633" class="h">Execute dependencies</text><text x="475" y="664" class="body">Generate/search → retain actual artifact</text><text x="475" y="696" class="body">Delivery receives artifact directly</text>
<rect x="925" y="597" width="422" height="133" rx="10" class="box"/><text x="945" y="633" class="h">Commit delivery + receipt</text><text x="945" y="664" class="body">Persist identity and actual outcome</text><text x="945" y="696" class="body">Retry delivery without regenerating</text>
<path d="M1010 494 V533 H225 V589" class="wire" marker-end="url(#a)"/><path d="M403 664 H447" class="wire" marker-end="url(#a)"/><path d="M873 664 H917" class="wire" marker-end="url(#a)"/>
<rect x="28" y="781" width="1344" height="149" rx="15" fill="#fff0da"/><text x="48" y="811" class="small">4 · PRESENTATION — REAL RESULTS</text>
<rect x="48" y="832" width="574" height="72" rx="10" class="box"/><text x="68" y="861" class="h">Ordered reply + graph output adapter</text><text x="68" y="887" class="small">Insert actual result; finalize dependent prose from the outcome</text>
<rect x="678" y="832" width="669" height="72" rx="10" class="box"/><text x="698" y="861" class="h">Phone / social views + RP timeline</text><text x="698" y="887" class="small">Shared committed records — displaying a delivery does not send it again</text>
<path d="M1136 730 V773 H335 V824" class="wire" marker-end="url(#a)"/><path d="M1136 773 V824" class="wire" marker-end="url(#a)"/>
<text x="42" y="969" class="body">Graph output selection and in-world delivery destination are separate. No model-generated future filenames or image IDs.</text>
</svg>
